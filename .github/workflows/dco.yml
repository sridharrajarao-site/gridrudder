name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  signoff:
    name: DCO / commit sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull-request commits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify every commit sign-off
        env:
          DCO_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DCO_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/check_dco.py "$DCO_BASE_SHA" "$DCO_HEAD_SHA"
