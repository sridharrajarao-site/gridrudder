name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q gridgpu tests tools
      - name: Run core tests
        run: python -m unittest discover -s tests -v
      - name: Validate intake schema
        run: python -m json.tool docs/design-partner-intake.schema.json >/dev/null
      - name: Build and scan public package
        run: python tools/build_public_release.py
      - name: Verify public-package checksum
        working-directory: dist
        run: sha256sum --check gridrudder-public-preview.tar.gz.sha256
      - name: Verify archive contents and isolated quickstart
        run: python tools/verify_public_release.py dist/gridrudder-public-preview.tar.gz
      - name: Upload public-package candidate
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gridrudder-public-preview
          path: |
            dist/gridrudder-public-preview.tar.gz
            dist/gridrudder-public-preview.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  site:
    name: Site / build, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build and test rendered pages
        run: npm test
